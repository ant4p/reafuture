<!-- Стили для кнопок навигации (добавьте в секцию <style> вашего шаблона) -->
<style>
    /* Контейнер для кнопок навигации */
    .nav-floating-buttons {
        position: fixed;
        right: 2rem;
        bottom: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        z-index: 999;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.4s ease, transform 0.4s ease;
        pointer-events: none;
    }
    
    .nav-floating-buttons.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }
    
    /* Базовая кнопка */
    .nav-button {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(8, 18, 28, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(79, 159, 255, 0.3);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 20px rgba(79, 159, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #b0e0ff;
        font-size: 1.5rem;
        position: relative;
        overflow: hidden;
    }
    
    /* Эффект свечения при наведении */
    .nav-button:hover {
        border-color: #4f9fff;
        box-shadow: 0 4px 20px rgba(79, 159, 255, 0.4), 0 0 30px #4f9fff;
        color: #ffffff;
        transform: scale(1.05);
    }
    
    /* Разные цвета для кнопок */
    .nav-button.top:hover {
        border-color: #4f9fff;
        box-shadow: 0 4px 20px rgba(79, 159, 255, 0.4), 0 0 30px #4f9fff;
    }
    
    .nav-button.bottom:hover {
        border-color: #88ff88;
        box-shadow: 0 4px 20px rgba(136, 255, 136, 0.4), 0 0 30px #88ff88;
    }
    
    /* Иконки */
    .nav-button::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, rgba(79, 159, 255, 0.2) 0%, transparent 70%);
        opacity: 0;
        transition: opacity 0.3s;
    }
    
    .nav-button:hover::before {
        opacity: 1;
    }
    
    .nav-button span {
        position: relative;
        z-index: 2;
        font-size: 1.8rem;
        line-height: 1;
        filter: drop-shadow(0 0 5px currentColor);
    }
    
    /* Индикатор прогресса (кольцо вокруг кнопки) */
    .progress-indicator {
        position: absolute;
        top: -3px;
        left: -3px;
        right: -3px;
        bottom: -3px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #4f9fff;
        border-right-color: #88ff88;
        animation: spin 2s linear infinite;
        opacity: 0.5;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    /* Тултип (подсказка) */
    .nav-button-tooltip {
        position: absolute;
        right: 60px;
        background: rgba(8, 18, 28, 0.9);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(79, 159, 255, 0.3);
        padding: 0.4rem 1rem;
        border-radius: 20px;
        font-size: 0.8rem;
        color: #b0e0ff;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        letter-spacing: 0.5px;
    }
    
    .nav-button:hover .nav-button-tooltip {
        opacity: 1;
        transform: translateX(0);
    }
    
    /* Адаптация для мобильных */
    @media (max-width: 768px) {
        .nav-floating-buttons {
            right: 1rem;
            bottom: 1rem;
            gap: 0.5rem;
        }
        
        .nav-button {
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
        }
        
        .nav-button span {
            font-size: 1.4rem;
        }
        
        .nav-button-tooltip {
            display: none; /* Скрываем подсказки на мобильных */
        }
    }
    
    /* Анимация пульсации */
    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 4px 15px rgba(79, 159, 255, 0.4); }
        50% { transform: scale(1.1); box-shadow: 0 4px 25px rgba(79, 159, 255, 0.8), 0 0 40px #4f9fff; }
        100% { transform: scale(1); box-shadow: 0 4px 15px rgba(79, 159, 255, 0.4); }
    }
    
    /* Анимация для появления кнопок */
    @keyframes slideInRight {
        from {
            opacity: 0;
            transform: translateX(20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
</style>

<!-- Кнопки навигации (только две: вверх и вниз) -->
<div class="nav-floating-buttons" id="navButtons">
    <!-- Кнопка "Наверх" -->
    <div class="nav-button top" onclick="scrollToTop()" id="topButton">
        <span>↑</span>
        <div class="progress-indicator" id="topProgress" style="display: none;"></div>
        <div class="nav-button-tooltip">НАВЕРХ</div>
    </div>
    
    <!-- Кнопка "Вниз" -->
    <div class="nav-button bottom" onclick="scrollToBottom()" id="bottomButton">
        <span>↓</span>
        <div class="nav-button-tooltip">ВНИЗ</div>
    </div>
</div>

<!-- JavaScript для управления кнопками -->
<script>
    // Плавная прокрутка наверх
    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }
    
    // Плавная прокрутка вниз
    function scrollToBottom() {
        window.scrollTo({
            top: document.documentElement.scrollHeight,
            behavior: 'smooth'
        });
    }
    
    // Показать/скрыть кнопки при прокрутке
    window.addEventListener('scroll', function() {
        const navButtons = document.getElementById('navButtons');
        const scrollPosition = window.scrollY;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        
        // Показываем кнопки, если прокрутка больше 300px
        if (scrollPosition > 300) {
            navButtons.classList.add('visible');
        } else {
            navButtons.classList.remove('visible');
        }
        
        // Обновляем индикатор прогресса для кнопки "Наверх"
        const topProgress = document.getElementById('topProgress');
        const scrollPercent = (scrollPosition / (documentHeight - windowHeight)) * 100;
        
        if (scrollPosition > 100) {
            topProgress.style.display = 'block';
            // Вращение индикатора зависит от процента прокрутки
            topProgress.style.transform = `rotate(${scrollPercent * 3.6}deg)`;
        } else {
            topProgress.style.display = 'none';
        }
    });
    
    // Дополнительная анимация: меняем цвет кнопки "Вниз" при достижении низа
    window.addEventListener('scroll', function() {
        const bottomButton = document.getElementById('bottomButton');
        const scrollPosition = window.scrollY;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        
        // Если мы близко к низу (менее 200px до конца)
        if (documentHeight - scrollPosition - windowHeight < 200) {
            bottomButton.style.borderColor = '#88ff88';
            bottomButton.style.boxShadow = '0 4px 20px rgba(136, 255, 136, 0.3), 0 0 20px #88ff88';
        } else {
            bottomButton.style.borderColor = 'rgba(79, 159, 255, 0.3)';
            bottomButton.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.5), 0 0 20px rgba(79, 159, 255, 0.2)';
        }
    });
    
    // Эффект пульсации при первом появлении
    let firstScroll = true;
    window.addEventListener('scroll', function() {
        if (firstScroll && window.scrollY > 300) {
            const buttons = document.querySelectorAll('.nav-button');
            buttons.forEach(button => {
                button.style.animation = 'pulse 0.5s ease';
                setTimeout(() => {
                    button.style.animation = '';
                }, 500);
            });
            firstScroll = false;
        }
    });
    
    // Скрываем кнопку "Вниз", когда мы в самом низу
    window.addEventListener('scroll', function() {
        const bottomButton = document.getElementById('bottomButton');
        const scrollPosition = window.scrollY;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        
        // Если мы в самом низу (менее 50px до конца)
        if (documentHeight - scrollPosition - windowHeight < 50) {
            bottomButton.style.opacity = '0.3';
            bottomButton.style.pointerEvents = 'none';
            bottomButton.style.cursor = 'default';
        } else {
            bottomButton.style.opacity = '1';
            bottomButton.style.pointerEvents = 'auto';
            bottomButton.style.cursor = 'pointer';
        }
    });
</script>
